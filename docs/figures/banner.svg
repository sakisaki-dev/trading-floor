<svg xmlns="http://www.w3.org/2000/svg" width="800" height="190" viewBox="0 0 800 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Trading Floor. 500 bots, one card market, no instructions. 200 weeks on engine 2.0, seed 31761: bots 501 to 344, Vault index 100 to 77, marks index 100 to 385, 2 tactics. 7,973 weeks on engine 1.x, seed 11906: the top family reached 93% of bots, bots fell to 64 and recovered to 303, the 10% with the most cash held 85% of coins, bots took 2,500 weeks to relearn trading with each other.">
