name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The simulation has no dependencies, so there is nothing to install.
      - name: Engine tests (mechanisms, networks, determinism, hidden information)
        run: npm test
      - name: The committed page matches the engine
        run: |
          node tools/build_page.mjs
          git diff --exit-code docs/trading-floor.html
